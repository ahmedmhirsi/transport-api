openapi: 3.0.3
info:
  title: API de Réservation de Transport
  description: API REST pour la gestion de réservations de transport - MVP Stage 4 semaines
  version: 1.0.0
  contact:
    name: API Support
    email: admin@transport.tn

servers:
  - url: http://localhost:8080
    description: Docker Development
  - url: http://localhost/dxc/backend/public
    description: XAMPP Development

tags:
  - name: Authentication
    description: Authentification utilisateur JWT
  - name: Trajets
    description: Gestion des trajets
  - name: Reservations
    description: Gestion des réservations
  - name: Third-Party
    description: API pour applications tierces
  - name: Webhooks
    description: Système de webhooks

paths:
  /api/login:
    post:
      tags: [Authentication]
      summary: Connexion utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: 'admin@transport.tn' }
                password: { type: string, example: 'password' }
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  token: { type: string, example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...' }
                  expires_in: { type: integer, example: 3600 }
                  user:
                    type: object
                    properties:
                      id: { type: integer, example: 1 }
                      name: { type: string, example: 'Admin User' }
                      email: { type: string, example: 'admin@transport.tn' }
                      role: { type: string, example: 'admin' }
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Données de requête invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/trajets:
    get:
      tags: [Trajets]
      summary: Liste des trajets
      security:
        - bearerAuth: []
      parameters:
        - name: departure
          in: query
          schema: { type: string }
          description: Ville de départ
        - name: destination
          in: query
          schema: { type: string }
          description: Ville de destination
        - name: date
          in: query
          schema: { type: string, format: date }
          description: Date de départ
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Liste des trajets
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trajet'
                  meta:
                    $ref: '#/components/schemas/Pagination'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/reservations:
    get:
      tags: [Reservations]
      summary: Historique des réservations
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Historique des réservations
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reservation'
                  meta:
                    $ref: '#/components/schemas/Pagination'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

    post:
      tags: [Reservations]
      summary: Créer une réservation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trajet_id, seats]
              properties:
                trajet_id: { type: integer, example: 1 }
                seats: { type: integer, minimum: 1, example: 2 }
      responses:
        '201':
          description: Réservation créée
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 'Réservation créée avec succès' }
                  data:
                    $ref: '#/components/schemas/Reservation'
        '400':
          description: Requête invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Places insuffisantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/reservations/{id}:
    get:
      tags: [Reservations]
      summary: Détail d'une réservation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Détail de la réservation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Reservation'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Non autorisé }
        '404':
          description: Réservation non trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/reservations/{id}/cancel:
    post:
      tags: [Reservations]
      summary: Annuler une réservation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Réservation annulée
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: 'Réservation annulée avec succès' }
        '400':
          description: Réservation déjà annulée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Non autorisé }
        '404':
          description: Réservation non trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/third-party/reservations:
    get:
      tags: [Third-Party]
      summary: Liste des réservations (app tierce)
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Liste des réservations
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reservation'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/third-party/webhook-events:
    get:
      tags: [Third-Party]
      summary: Historique des webhooks
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Liste des événements
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, example: 1 }
                        event: { type: string, example: 'reservation.created' }
                        payload: { type: object }
                        created_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/third-party/stats:
    get:
      tags: [Third-Party]
      summary: Statistiques
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Statistiques
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      total_reservations: { type: integer, example: 150 }
                      total_revenue: { type: number, example: 5400.5 }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: 'INVALID_CREDENTIALS' }
            message: { type: string, example: 'Message d\'erreur descriptif' }

    Trajet:
      type: object
      properties:
        id: { type: integer, example: 1 }
        departure: { type: string, example: 'Tunis' }
        destination: { type: string, example: 'Sousse' }
        departure_time: { type: string, format: date-time, example: '2026-10-15T08:00:00Z' }
        arrival_time: { type: string, format: date-time, example: '2026-10-15T10:30:00Z' }
        price: { type: number, example: 25.0 }
        available_seats: { type: integer, example: 15 }
        status: { type: string, example: 'active' }

    Reservation:
      type: object
      properties:
        id: { type: integer, example: 1 }
        trajet_id: { type: integer, example: 1 }
        user_id: { type: integer, example: 2 }
        seats: { type: integer, example: 2 }
        total_price: { type: number, example: 50.0 }
        status: { type: string, example: 'confirmed' }
        created_at: { type: string, format: date-time, example: '2026-09-07T10:00:00Z' }

    Pagination:
      type: object
      properties:
        current_page: { type: integer, example: 1 }
        per_page: { type: integer, example: 20 }
        total: { type: integer, example: 45 }
        total_pages: { type: integer, example: 3 }

  responses:
    Unauthorized:
      description: Non authentifié
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Trop de requêtes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
