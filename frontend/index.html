<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Transport Reservation</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
    </div>

    <div class="login-container fade-in">
        <div class="glass-panel login-card">
            <div class="login-logo">🚌</div>
            <h2>Connexion</h2>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Système de Réservation</p>
            
            <form id="login-form">
                <div class="form-group">
                    <input type="email" id="email" class="form-control" placeholder="✉️ Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" class="form-control" placeholder="🔑 Mot de passe" required>
                </div>
                <div id="login-error" style="margin-bottom: 1rem; font-size: 0.9rem;"></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Se Connecter</button>
            </form>
            
            
            <div style="margin-top: 1rem;">
                <a href="third-party.html" style="font-size: 0.85rem;">Accès Partenaires (API) &rarr;</a>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
