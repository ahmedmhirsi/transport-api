<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservations - Transport Reservation</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
    </div>

    <nav class="glass-panel navbar">
        <div class="nav-brand">🚌 Transport API</div>
        <ul class="nav-links">
            <li><a href="dashboard.html">📊 Dashboard</a></li>
            <li><a href="trajets.html">🛣️ Trajets</a></li>
            <li><a href="reservations.html" class="active">🎫 Réservations</a></li>
        </ul>
        <div class="user-info">
            <span id="user-email">Loading...</span>
            <button id="logout-btn" class="btn btn-sm btn-secondary">Déconnexion</button>
        </div>
    </nav>

    <div class="container fade-in">
        <h2>Mes Réservations</h2>

        <div class="glass-panel table-container">
            <table id="reservations-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Trajet</th>
                        <th>Date</th>
                        <th>Places</th>
                        <th>Statut</th>
                        <th>Date création</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Populated by JS -->
                </tbody>
            </table>
            
            <div id="pagination-info" class="pagination" style="padding: 1rem; text-align: center;"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
