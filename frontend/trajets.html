<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trajets - Transport Reservation</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="loader" class="loader-overlay">
        <div class="spinner"></div>
    </div>

    <nav class="glass-panel navbar">
        <div class="nav-brand">🚌 Transport API</div>
        <ul class="nav-links">
            <li><a href="dashboard.html">📊 Dashboard</a></li>
            <li><a href="trajets.html" class="active">🛣️ Trajets</a></li>
            <li><a href="reservations.html">🎫 Réservations</a></li>
        </ul>
        <div class="user-info">
            <span id="user-email">Loading...</span>
            <button id="logout-btn" class="btn btn-sm btn-secondary">Déconnexion</button>
        </div>
    </nav>

    <div class="container fade-in">
        <h2>Recherche de Trajets</h2>
        
        <form id="search-form" class="glass-panel filter-bar">
            <div class="form-group">
                <label class="form-label">Départ</label>
                <input type="text" id="search-depart" class="form-control" placeholder="Ville de départ">
            </div>
            <div class="form-group">
                <label class="form-label">Destination</label>
                <input type="text" id="search-dest" class="form-control" placeholder="Ville d'arrivée">
            </div>
            <div class="form-group">
                <label class="form-label">Date</label>
                <input type="date" id="search-date" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary" style="height: fit-content;">🔍 Rechercher</button>
        </form>

        <div class="glass-panel table-container">
            <table id="trajets-table">
                <thead>
                    <tr>
                        <th>Départ</th>
                        <th>Destination</th>
                        <th>Date</th>
                        <th>Heure départ</th>
                        <th>Heure arrivée</th>
                        <th>Capacité</th>
                        <th>Dispo</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Réserver -->
    <div id="reserve-modal" class="modal-overlay">
        <div class="glass-panel modal-content">
            <div class="modal-header">
                <h3>Réserver un trajet</h3>
                <button class="close-modal" id="close-modal">&times;</button>
            </div>
            <p id="modal-title" style="margin-bottom: 1rem; color: var(--text-muted);"></p>
            <div class="form-group">
                <label class="form-label">Nombre de places</label>
                <input type="number" id="seats-input" class="form-control" min="1" value="1">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancel-reserve">Annuler</button>
                <button class="btn btn-primary" id="confirm-reserve">Confirmer</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
